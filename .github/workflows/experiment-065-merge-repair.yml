name: Experiment 065 Recovery Merge Repair
on:
  push:
    paths:
      - evaluation_requests/experiment_065_merge_repair.request.json
permissions:
  contents: read
  actions: read
jobs:
  validate-artifact-partition:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile repository Python
        run: python -m compileall -q src scripts
      - name: Enforce frozen scientific implementation
        run: test "$(git hash-object scripts/run_experiment_065_development_shard.py)" = '213a82efbdc24b550ae5b152d17349c49a946bb7'
      - name: Verify exact canonical/recovery artifact partition without reading outcomes
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          repo = 'JosiahChristian/Adaptive-Model-Gating'
          canonical_run_id = 33220329747
          recovery_run_id = 33285145875
          token = os.environ['GH_TOKEN']

          def api(path):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def artifact_names(run_id):
              names = []
              page = 1
              while True:
                  data = api(f'/actions/runs/{run_id}/artifacts?per_page=100&page={page}')
                  batch = data['artifacts']
                  names.extend(a['name'] for a in batch if not a['expired'])
                  if len(batch) < 100:
                      return names
                  page += 1

          canonical_run = api(f'/actions/runs/{canonical_run_id}')
          recovery_run = api(f'/actions/runs/{recovery_run_id}')
          assert canonical_run['status'] == 'completed', canonical_run['status']
          assert recovery_run['status'] == 'completed', recovery_run['status']

          manifest = json.loads(Path('evaluation_requests/experiment_065_recovery.request.json').read_text())
          assert manifest['experiment'] == 65
          assert manifest['execution_repair_issue'] == 267
          assert manifest['canonical_run_id'] == canonical_run_id
          assert manifest['canonical_head_sha'] == 'b50cec02a327ffdf8b4490ceae079ede087cff02'
          assert manifest['validation_seeds_touched'] is False
          assert manifest['no_tuning'] is True

          canonical = artifact_names(canonical_run_id)
          recovery = artifact_names(recovery_run_id)

          for panel in ('DQ1','DQ2','DQ3','DQ4','DQ5','DQ6'):
              assert f'experiment-065-{panel}' in canonical

          canonical_pat = re.compile(r'^experiment-065-DP-cell-(\d+)-chunk-(\d+)$')
          recovery_pat = re.compile(r'^experiment-065-recovery-DP-cell-(\d+)-chunk-(\d+)$')
          observed_canonical = sorted(
              (int(m.group(1)), int(m.group(2)))
              for name in canonical if (m := canonical_pat.match(name))
          )
          frozen_canonical = sorted(
              (int(x['cell_index']), int(x['chunk_index']))
              for x in manifest['canonical_successful_dp']
          )

          expected = {(cell, chunk) for cell in range(16) for chunk in range(16)}
          frozen_missing = sorted(expected - set(frozen_canonical))
          observed_recovery = sorted(
              (int(m.group(1)), int(m.group(2)))
              for name in recovery if (m := recovery_pat.match(name))
          )
          missing_recovery_artifacts = sorted(set(frozen_missing) - set(observed_recovery))
          unexpected_recovery_artifacts = sorted(set(observed_recovery) - set(frozen_missing))
          duplicate_recovery_artifacts = sorted({x for x in observed_recovery if observed_recovery.count(x) > 1})

          diagnostic = {
              'canonical_artifact_count': len(observed_canonical),
              'frozen_canonical_count': len(frozen_canonical),
              'expected_recovery_count': len(frozen_missing),
              'observed_recovery_count': len(observed_recovery),
              'missing_recovery_artifact_coordinates': missing_recovery_artifacts,
              'unexpected_recovery_artifact_coordinates': unexpected_recovery_artifacts,
              'duplicate_recovery_artifact_coordinates': duplicate_recovery_artifacts,
          }
          Path('artifact_partition_diagnostic.json').write_text(json.dumps(diagnostic, indent=2) + '\n')
          print(json.dumps(diagnostic, sort_keys=True))

          assert len(frozen_canonical) == len(set(frozen_canonical))
          assert observed_canonical == frozen_canonical, (observed_canonical, frozen_canonical)
          assert not missing_recovery_artifacts, missing_recovery_artifacts
          assert not unexpected_recovery_artifacts, unexpected_recovery_artifacts
          assert not duplicate_recovery_artifacts, duplicate_recovery_artifacts
          assert len(observed_recovery) == len(set(observed_recovery))
          assert set(frozen_canonical).isdisjoint(observed_recovery)
          assert set(frozen_canonical) | set(observed_recovery) == expected

          print(f'Artifact-only partition verified: {len(frozen_canonical)} canonical + {len(observed_recovery)} recovery = 256 DP coordinates.')
          PY
      - name: Preserve coordinate-only partition diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-065-artifact-partition-diagnostic
          path: artifact_partition_diagnostic.json
          if-no-files-found: error
          retention-days: 30
  merge:
    needs: validate-artifact-partition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen canonical artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33220329747
          pattern: experiment-065-*
          path: results/experiment_065_canonical_downloads
          merge-multiple: false
      - name: Download completed recovery artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33285145875
          pattern: experiment-065-recovery-*
          path: results/experiment_065_recovery_downloads
          merge-multiple: false
      - name: Reconstruct exact development evidence
        run: python scripts/merge_experiment_065_recovery.py --canonical-root results/experiment_065_canonical_downloads --recovery-root results/experiment_065_recovery_downloads --manifest evaluation_requests/experiment_065_recovery.request.json --out results/experiment_065_development_evidence
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-065-development-recovered-evidence
          path: results/experiment_065_development_evidence/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
