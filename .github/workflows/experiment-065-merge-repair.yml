name: Experiment 065 Recovery Merge Repair
on:
  push:
    paths:
      - evaluation_requests/experiment_065_merge_repair.request.json
permissions:
  contents: read
  actions: read
jobs:
  validate-artifact-partition:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile repository Python
        run: python -m compileall -q src scripts
      - name: Enforce frozen scientific implementation
        run: test "$(git hash-object scripts/run_experiment_065_development_shard.py)" = '213a82efbdc24b550ae5b152d17349c49a946bb7'
      - name: Verify preserved canonical source and exact recovery artifact partition
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          repo = 'JosiahChristian/Adaptive-Model-Gating'
          canonical_source_run_id = 33220329747
          canonical_preservation_run_id = 33295661114
          recovery_run_id = 33285145875
          preserved_name = 'experiment-065-canonical-preserved-bundle'
          preserved_digest = 'sha256:db2aa7b3202fe5ee281dec0b18f1554176f9f92bfeda8e64ac9e96520d988a60'
          token = os.environ['GH_TOKEN']

          def api(path):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def artifacts(run_id):
              items = []
              page = 1
              while True:
                  data = api(f'/actions/runs/{run_id}/artifacts?per_page=100&page={page}')
                  batch = data['artifacts']
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
                  page += 1

          manifest = json.loads(Path('evaluation_requests/experiment_065_recovery.request.json').read_text())
          assert manifest['experiment'] == 65
          assert manifest['execution_repair_issue'] == 267
          assert manifest['canonical_run_id'] == canonical_source_run_id
          assert manifest['canonical_head_sha'] == 'b50cec02a327ffdf8b4490ceae079ede087cff02'
          assert manifest['validation_seeds_touched'] is False
          assert manifest['no_tuning'] is True

          preservation_run = api(f'/actions/runs/{canonical_preservation_run_id}')
          recovery_run = api(f'/actions/runs/{recovery_run_id}')
          preservation_items = [a for a in artifacts(canonical_preservation_run_id) if a['name'] == preserved_name]
          recovery_items = [a for a in artifacts(recovery_run_id) if not a['expired']]

          frozen_canonical = sorted(
              (int(x['cell_index']), int(x['chunk_index']))
              for x in manifest['canonical_successful_dp']
          )
          expected = {(cell, chunk) for cell in range(16) for chunk in range(16)}
          frozen_missing = sorted(expected - set(frozen_canonical))
          recovery_pat = re.compile(r'^experiment-065-recovery-DP-cell-(\d+)-chunk-(\d+)$')
          observed_recovery = sorted(
              (int(m.group(1)), int(m.group(2)))
              for a in recovery_items
              if (m := recovery_pat.match(a['name']))
          )
          missing_recovery = sorted(set(frozen_missing) - set(observed_recovery))
          unexpected_recovery = sorted(set(observed_recovery) - set(frozen_missing))
          duplicates = sorted({x for x in observed_recovery if observed_recovery.count(x) > 1})

          diagnostic = {
              'canonical_source_run_id': canonical_source_run_id,
              'canonical_source_original_artifacts_expired': True,
              'canonical_preservation_run_id': canonical_preservation_run_id,
              'preservation_run_status': preservation_run['status'],
              'preservation_run_conclusion': preservation_run.get('conclusion'),
              'preserved_bundle_matches': len(preservation_items),
              'preserved_bundle_expired': preservation_items[0]['expired'] if preservation_items else None,
              'preserved_bundle_digest': preservation_items[0].get('digest') if preservation_items else None,
              'frozen_canonical_dp_count': len(frozen_canonical),
              'expected_recovery_count': len(frozen_missing),
              'observed_recovery_count': len(observed_recovery),
              'missing_recovery_artifact_coordinates': missing_recovery,
              'unexpected_recovery_artifact_coordinates': unexpected_recovery,
              'duplicate_recovery_artifact_coordinates': duplicates,
              'recovery_run_status': recovery_run['status'],
              'recovery_run_conclusion': recovery_run.get('conclusion'),
          }
          Path('artifact_partition_diagnostic.json').write_text(json.dumps(diagnostic, indent=2) + '\n')
          print(json.dumps(diagnostic, sort_keys=True))

          assert preservation_run['status'] == 'completed'
          assert preservation_run.get('conclusion') == 'success'
          assert len(preservation_items) == 1
          assert preservation_items[0]['expired'] is False
          assert preservation_items[0].get('digest') == preserved_digest
          assert recovery_run['status'] == 'completed'
          assert len(frozen_canonical) == 10
          assert len(frozen_canonical) == len(set(frozen_canonical))
          assert len(frozen_missing) == 246
          assert not missing_recovery, missing_recovery
          assert not unexpected_recovery, unexpected_recovery
          assert not duplicates, duplicates
          assert len(observed_recovery) == 246
          assert set(frozen_canonical).isdisjoint(observed_recovery)
          assert set(frozen_canonical) | set(observed_recovery) == expected
          print('Artifact-only partition verified: 10 preserved canonical DP + 246 recovery DP = 256 coordinates; preserved canonical bundle is authoritative.')
          PY
      - name: Preserve coordinate-only partition diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-065-artifact-partition-diagnostic
          path: artifact_partition_diagnostic.json
          if-no-files-found: error
          retention-days: 30
  merge:
    needs: validate-artifact-partition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download preserved frozen canonical bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33295661114
          name: experiment-065-canonical-preserved-bundle
          path: results/experiment_065_canonical_downloads
      - name: Download completed recovery artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33285145875
          pattern: experiment-065-recovery-*
          path: results/experiment_065_recovery_downloads
          merge-multiple: false
      - name: Reconstruct exact development evidence
        run: python scripts/merge_experiment_065_recovery.py --canonical-root results/experiment_065_canonical_downloads --recovery-root results/experiment_065_recovery_downloads --manifest evaluation_requests/experiment_065_recovery.request.json --out results/experiment_065_development_evidence
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-065-development-recovered-evidence
          path: results/experiment_065_development_evidence/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
