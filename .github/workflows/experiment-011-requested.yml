name: Experiment 011 Requested Evaluation
on:
  push:
    paths:
      - evaluation_requests/experiment_011.request
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
  evaluate-shards:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - {family: healthy, magnitude: '0.0', label: healthy_0.00}
          - {family: drift, magnitude: '0.25', label: drift_0.25}
          - {family: drift, magnitude: '0.5', label: drift_0.50}
          - {family: drift, magnitude: '1.0', label: drift_1.00}
          - {family: common_mode, magnitude: '0.25', label: common_mode_0.25}
          - {family: common_mode, magnitude: '0.5', label: common_mode_0.50}
          - {family: common_mode, magnitude: '1.0', label: common_mode_1.00}
          - {family: primary_fault, magnitude: '0.25', label: primary_fault_0.25}
          - {family: primary_fault, magnitude: '0.5', label: primary_fault_0.50}
          - {family: primary_fault, magnitude: '1.0', label: primary_fault_1.00}
          - {family: drift_anchor_fault, magnitude: '0.25', label: drift_anchor_fault_0.25}
          - {family: drift_anchor_fault, magnitude: '0.5', label: drift_anchor_fault_0.50}
          - {family: drift_anchor_fault, magnitude: '1.0', label: drift_anchor_fault_1.00}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run frozen Experiment 011 cell
        env:
          EXPERIMENT_011_FAMILY: ${{ matrix.family }}
          EXPERIMENT_011_MAGNITUDE: ${{ matrix.magnitude }}
          EXPERIMENT_011_LABEL: ${{ matrix.label }}
        run: python scripts/run_experiment_011_shard.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: results/experiment_011_shards/${{ matrix.label }}/
          if-no-files-found: error
  evaluate:
    needs: evaluate-shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {path: results/experiment_011_shards}
      - run: python scripts/merge_experiment_011_shards.py
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-011-evidence
          path: results/experiment_011/
          if-no-files-found: error
      - name: Register completed evidence run
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('results/experiment_011/report.json').read_text())
          body=f'''Automated completed evidence pointer for Experiment 011.\n\n- run_id: {os.environ['GITHUB_RUN_ID']}\n- head_sha: {os.environ['GITHUB_SHA']}\n- artifact_name: experiment-011-evidence\n- status: completed\n- execution: sharded across thirteen frozen cells\n\n```json\n{json.dumps(report,indent=2)}\n```\n'''
          Path('/tmp/experiment011_issue.md').write_text(body)
          PY
          gh issue create --title "Experiment 011 evidence run $GITHUB_RUN_ID" --body-file /tmp/experiment011_issue.md
