name: Experiment 055 Evaluator Prospective Preflight
on:
  push:
    paths:
      - scripts/run_experiment_055.py
      - scripts/run_experiment_055_shard.py
      - scripts/merge_experiment_055_shards.py
      - scripts/smoke_experiment_055_evaluator.py
      - .github/workflows/experiment-055-evaluator-preflight.yml
permissions: {contents: read, issues: write}
jobs:
  validate-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile Experiment 055 evaluation path
        run: python -m py_compile src/experiment_055.py scripts/run_experiment_055.py scripts/run_experiment_055_shard.py scripts/merge_experiment_055_shards.py scripts/smoke_experiment_055_evaluator.py
      - name: Experiment 055 evaluator prospective smoke
        run: python scripts/smoke_experiment_055_evaluator.py
      - name: Static provenance contract
        run: |
          grep -q "experiment055_cell" scripts/run_experiment_055_shard.py
          grep -q "experiment055_cell" scripts/merge_experiment_055_shards.py
      - name: Register evaluator preflight success
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          cat > /tmp/preflight.md <<EOF
          Experiment 055 complete evaluator-path prospective preflight passed before any evaluation request.

          - run_id: $GITHUB_RUN_ID
          - head_sha: $GITHUB_SHA
          - operative_spec_issue: #190
          - checks: compile, evaluator smoke, exact 345/344 signed-rank tails, frozen 55000..55999 seed contract, 1/3 baseline + 2/3 target allocation, generation-time audit provenance contract
          - outcome_access: none; no Experiment 055 evaluation has been requested by this workflow
          EOF
          gh issue create --title "Experiment 055 evaluator prospective preflight $GITHUB_RUN_ID" --body-file /tmp/preflight.md
