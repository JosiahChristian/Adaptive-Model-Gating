name: Experiment 034 Requested Evaluation
on:
  push:
    paths: [evaluation_requests/experiment_034.request]
permissions: {contents: read, issues: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m compileall -q src scripts
      - run: python scripts/smoke_experiment_034.py
  prepare:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          sys.path.insert(0,'src')
          from experiment_034 import CELLS
          print('cells='+json.dumps([{'label':c['label']} for c in CELLS],separators=(',',':')))
          PY
  evaluate-shards:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run frozen Experiment 034 cell
        env:
          EXPERIMENT_034_LABEL: ${{ matrix.label }}
        run: python scripts/run_experiment_034_shard.py
      - uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.label }}'
          path: 'results/experiment_034_shards/${{ matrix.label }}/'
          if-no-files-found: error
          compression-level: 9
          retention-days: 1
  evaluate:
    needs: evaluate-shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {path: results/experiment_034_shards}
      - run: python scripts/merge_experiment_034_shards.py
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-034-evidence
          path: results/experiment_034/
          if-no-files-found: error
          compression-level: 9
      - name: Register completed evidence pointer
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('results/experiment_034/report.json').read_text())
          compact={k:r.get(k) for k in ('evaluation_seeds','n_seeds_per_cell','cell_count','strategies','audit_seeds','bootstrap_seed','bootstrap_resamples','hypotheses','accept_threshold','wrong_action_cost','fallback_cost','explicit_topology_truth','no_recalibration','summary_row_count','audit_row_count')}
          body=('Automated completed evidence pointer for Experiment 034.\n\n'
                f"- run_id: {os.environ['GITHUB_RUN_ID']}\n- head_sha: {os.environ['GITHUB_SHA']}\n"
                '- artifact_name: experiment-034-evidence\n- status: completed\n'
                '- execution: 18-cell, 500-seed topology-permutation structural-transfer evaluation\n'
                '- full_report: results/experiment_034/report.json inside artifact `experiment-034-evidence`\n\n'
                '```json\n'+json.dumps(compact,indent=2)+'\n```\n')
          Path('/tmp/experiment034_issue.md').write_text(body)
          PY
          gh issue create --title "Experiment 034 evidence run $GITHUB_RUN_ID" --body-file /tmp/experiment034_issue.md
