name: Experiment 039 Preflight
on:
  push:
    paths:
      - src/experiment_039.py
      - scripts/run_experiment_039.py
      - scripts/run_experiment_039_shard.py
      - scripts/merge_experiment_039_shards.py
      - scripts/smoke_experiment_039.py
      - research/experiment_039_spec.md
      - .github/workflows/experiment-039-preflight.yml
      - .github/workflows/experiment-039-requested.yml
permissions: {contents: read, issues: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m compileall -q src scripts
      - run: python scripts/smoke_experiment_039.py
      - name: Register preflight success
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh issue create --title "Experiment 039 preflight passed $GITHUB_RUN_ID" --body "Experiment 039 preflight completed successfully.\n\n- run_id: $GITHUB_RUN_ID\n- head_sha: $GITHUB_SHA\n- checks: compileall + smoke_experiment_039.py\n- status: passed\n- evaluation_requested: false"
