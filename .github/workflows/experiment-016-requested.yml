name: Experiment 016 Requested Evaluation
on:
  push:
    paths: [evaluation_requests/experiment_016.request]
permissions: {contents: read, issues: write}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_experiment_016.py
  evaluate-shards:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 22
      matrix:
        include:
          - {family: healthy, magnitude: '0.0', label: healthy_0.00}
          - {family: drift, magnitude: '0.25', label: drift_0.25}
          - {family: drift, magnitude: '0.5', label: drift_0.50}
          - {family: drift, magnitude: '1.0', label: drift_1.00}
          - {family: common_mode, magnitude: '0.25', label: common_mode_0.25}
          - {family: common_mode, magnitude: '0.5', label: common_mode_0.50}
          - {family: common_mode, magnitude: '1.0', label: common_mode_1.00}
          - {family: primary_fault, magnitude: '0.25', label: primary_fault_0.25}
          - {family: primary_fault, magnitude: '0.5', label: primary_fault_0.50}
          - {family: primary_fault, magnitude: '1.0', label: primary_fault_1.00}
          - {family: drift_ab_fault, magnitude: '0.25', label: drift_ab_fault_0.25}
          - {family: drift_ab_fault, magnitude: '0.5', label: drift_ab_fault_0.50}
          - {family: drift_ab_fault, magnitude: '1.0', label: drift_ab_fault_1.00}
          - {family: drift_ab_gain050, magnitude: '0.25', label: drift_ab_gain050_0.25}
          - {family: drift_ab_gain050, magnitude: '0.5', label: drift_ab_gain050_0.50}
          - {family: drift_ab_gain050, magnitude: '1.0', label: drift_ab_gain050_1.00}
          - {family: drift_ab_gain025, magnitude: '0.25', label: drift_ab_gain025_0.25}
          - {family: drift_ab_gain025, magnitude: '0.5', label: drift_ab_gain025_0.50}
          - {family: drift_ab_gain025, magnitude: '1.0', label: drift_ab_gain025_1.00}
          - {family: drift_all_aux_fault, magnitude: '0.25', label: drift_all_aux_fault_0.25}
          - {family: drift_all_aux_fault, magnitude: '0.5', label: drift_all_aux_fault_0.50}
          - {family: drift_all_aux_fault, magnitude: '1.0', label: drift_all_aux_fault_1.00}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run frozen Experiment 016 cell
        env:
          EXPERIMENT_016_FAMILY: ${{ matrix.family }}
          EXPERIMENT_016_MAGNITUDE: ${{ matrix.magnitude }}
          EXPERIMENT_016_LABEL: ${{ matrix.label }}
        run: python scripts/run_experiment_016_shard.py
      - uses: actions/upload-artifact@v4
        with: {name: '${{ matrix.label }}', path: 'results/experiment_016_shards/${{ matrix.label }}/', if-no-files-found: error}
  evaluate:
    needs: evaluate-shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {path: results/experiment_016_shards}
      - run: python scripts/merge_experiment_016_shards.py
      - uses: actions/upload-artifact@v4
        with: {name: experiment-016-evidence, path: results/experiment_016/, if-no-files-found: error}
      - name: Register completed evidence run
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('results/experiment_016/report.json').read_text())
          compact = {
              'tau': report.get('tau'),
              'kappa': report.get('kappa'),
              'kappa3': report.get('kappa3'),
              'lambda_probe_rounds': report.get('lambda_probe_rounds'),
              'probe_calibration_seeds': report.get('probe_calibration_seeds'),
              'evaluation_seeds': report.get('evaluation_seeds'),
              'bootstrap_seed': report.get('bootstrap_seed'),
              'probe_amplitudes': report.get('probe_amplitudes'),
              'sigma_probe': report.get('sigma_probe'),
              'n_seeds_per_cell': report.get('n_seeds_per_cell'),
              'strategies': report.get('strategies'),
              'audit_seeds': report.get('audit_seeds'),
              'cell_count': len(report.get('cells', [])),
          }
          body = (
              'Automated completed evidence pointer for Experiment 016.\n\n'
              f"- run_id: {os.environ['GITHUB_RUN_ID']}\n"
              f"- head_sha: {os.environ['GITHUB_SHA']}\n"
              '- artifact_name: experiment-016-evidence\n'
              '- status: completed\n'
              '- execution: sharded across twenty-two frozen cells\n'
              '- full_report: results/experiment_016/report.json inside artifact `experiment-016-evidence`\n\n'
              '```json\n' + json.dumps(compact, indent=2) + '\n```\n'
          )
          if len(body) >= 60000:
              raise RuntimeError(f'bounded evidence pointer unexpectedly too large: {len(body)}')
          Path('/tmp/experiment016_issue.md').write_text(body)
          PY
          gh issue create --title "Experiment 016 evidence run $GITHUB_RUN_ID" --body-file /tmp/experiment016_issue.md
