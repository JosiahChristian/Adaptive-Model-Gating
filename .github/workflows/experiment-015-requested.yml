name: Experiment 015 Requested Evaluation
on:
  push:
    paths: [evaluation_requests/experiment_015.request]
permissions: {contents: read, issues: write}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_experiment_015.py
  evaluate-shards:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 22
      matrix:
        include:
          - {family: healthy, magnitude: '0.0', label: healthy_0.00}
          - {family: drift, magnitude: '0.25', label: drift_0.25}
          - {family: drift, magnitude: '0.5', label: drift_0.50}
          - {family: drift, magnitude: '1.0', label: drift_1.00}
          - {family: common_mode, magnitude: '0.25', label: common_mode_0.25}
          - {family: common_mode, magnitude: '0.5', label: common_mode_0.50}
          - {family: common_mode, magnitude: '1.0', label: common_mode_1.00}
          - {family: primary_fault, magnitude: '0.25', label: primary_fault_0.25}
          - {family: primary_fault, magnitude: '0.5', label: primary_fault_0.50}
          - {family: primary_fault, magnitude: '1.0', label: primary_fault_1.00}
          - {family: drift_ab_fault, magnitude: '0.25', label: drift_ab_fault_0.25}
          - {family: drift_ab_fault, magnitude: '0.5', label: drift_ab_fault_0.50}
          - {family: drift_ab_fault, magnitude: '1.0', label: drift_ab_fault_1.00}
          - {family: drift_ab_weak_probe, magnitude: '0.25', label: drift_ab_weak_probe_0.25}
          - {family: drift_ab_weak_probe, magnitude: '0.5', label: drift_ab_weak_probe_0.50}
          - {family: drift_ab_weak_probe, magnitude: '1.0', label: drift_ab_weak_probe_1.00}
          - {family: drift_ab_cross_coupled_probe, magnitude: '0.25', label: drift_ab_cross_coupled_probe_0.25}
          - {family: drift_ab_cross_coupled_probe, magnitude: '0.5', label: drift_ab_cross_coupled_probe_0.50}
          - {family: drift_ab_cross_coupled_probe, magnitude: '1.0', label: drift_ab_cross_coupled_probe_1.00}
          - {family: drift_all_aux_fault, magnitude: '0.25', label: drift_all_aux_fault_0.25}
          - {family: drift_all_aux_fault, magnitude: '0.5', label: drift_all_aux_fault_0.50}
          - {family: drift_all_aux_fault, magnitude: '1.0', label: drift_all_aux_fault_1.00}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run frozen Experiment 015 cell
        env:
          EXPERIMENT_015_FAMILY: ${{ matrix.family }}
          EXPERIMENT_015_MAGNITUDE: ${{ matrix.magnitude }}
          EXPERIMENT_015_LABEL: ${{ matrix.label }}
        run: python scripts/run_experiment_015_shard.py
      - uses: actions/upload-artifact@v4
        with: {name: '${{ matrix.label }}', path: 'results/experiment_015_shards/${{ matrix.label }}/', if-no-files-found: error}
  evaluate:
    needs: evaluate-shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {path: results/experiment_015_shards}
      - run: python scripts/merge_experiment_015_shards.py
      - uses: actions/upload-artifact@v4
        with: {name: experiment-015-evidence, path: results/experiment_015/, if-no-files-found: error}
      - name: Register completed evidence run
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path('results/experiment_015/report.json').read_text())
          body=f"Automated completed evidence pointer for Experiment 015.\n\n- run_id: {os.environ['GITHUB_RUN_ID']}\n- head_sha: {os.environ['GITHUB_SHA']}\n- artifact_name: experiment-015-evidence\n- status: completed\n- execution: sharded across twenty-two frozen cells\n\n```json\n{json.dumps(report,indent=2)}\n```\n"
          Path('/tmp/experiment015_issue.md').write_text(body)
          PY
          gh issue create --title "Experiment 015 evidence run $GITHUB_RUN_ID" --body-file /tmp/experiment015_issue.md
