name: Experiment 056 Evaluator Prospective Preflight
on:
  push:
    paths:
      - scripts/run_experiment_056.py
      - scripts/run_experiment_056_shard.py
      - scripts/merge_experiment_056_shards.py
      - scripts/smoke_experiment_056_evaluator.py
      - .github/workflows/experiment-056-evaluator-preflight.yml
permissions: {contents: read, issues: write}
jobs:
  validate-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile Experiment 056 evaluation path
        run: python -m py_compile src/experiment_056.py scripts/run_experiment_056.py scripts/run_experiment_056_shard.py scripts/merge_experiment_056_shards.py scripts/smoke_experiment_056_evaluator.py
      - name: Experiment 056 evaluator prospective smoke
        run: python scripts/smoke_experiment_056_evaluator.py
      - name: Static provenance contract
        run: |
          grep -q "experiment056_cell" scripts/run_experiment_056_shard.py
          grep -q "experiment056_cell" scripts/merge_experiment_056_shards.py
      - name: Register evaluator preflight success
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          cat > /tmp/preflight.md <<EOF
          Experiment 056 complete evaluator-path prospective preflight passed before any evaluation request.

          - run_id: $GITHUB_RUN_ID
          - head_sha: $GITHUB_SHA
          - operative_spec_issue: #196
          - checks: compile, evaluator smoke, exact 345/344 signed-rank tails, frozen 56000..56999 seed contract, 1/3 baseline + 2/3 target allocation, generation-time audit provenance contract
          - replication: exact Experiment 055 scientific architecture on fresh seeds/stress ranges
          - outcome_access: none; no Experiment 056 evaluation has been requested by this workflow
          EOF
          gh issue create --title "Experiment 056 evaluator prospective preflight $GITHUB_RUN_ID" --body-file /tmp/preflight.md
