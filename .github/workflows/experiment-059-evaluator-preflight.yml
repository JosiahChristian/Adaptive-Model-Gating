name: Experiment 059 Evaluator Prospective Preflight
on:
  push:
    paths:
      - scripts/run_experiment_059.py
      - scripts/run_experiment_059_shard.py
      - scripts/merge_experiment_059_shards.py
      - scripts/smoke_experiment_059_evaluator.py
      - .github/workflows/experiment-059-evaluator-preflight.yml
permissions:
  contents: read
  issues: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile repository Python
        id: compile
        continue-on-error: true
        run: python -m compileall -q src scripts > /tmp/compile.log 2>&1
      - name: Experiment 059 evaluator smoke
        id: smoke
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        run: python scripts/smoke_experiment_059_evaluator.py > /tmp/smoke.log 2>&1
      - name: Static provenance contract
        id: provenance
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          shard=Path('scripts/run_experiment_059_shard.py').read_text()
          merge=Path('scripts/merge_experiment_059_shards.py').read_text()
          run=Path('scripts/run_experiment_059.py').read_text()
          assert "record['experiment059_cell']=c['label']" in shard
          assert "r.get('experiment059_cell','')" in merge
          assert 'SEEDS=range(63000,64000)' in run
          assert "'M1':(5951000" in run and "'M4':(5954000" in run
          print('Experiment 059 evaluator static provenance/seed contract passed')
          PY
      - name: Register evaluator preflight outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          compile_status='${{ steps.compile.outcome }}'
          smoke_status='${{ steps.smoke.outcome }}'
          provenance_status='${{ steps.provenance.outcome }}'
          {
            echo 'Experiment 059 complete evaluator-path prospective preflight completed before any evaluation request.'
            echo
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- head_sha: $GITHUB_SHA"
            echo '- operative_spec_issue: 215'
            echo "- compile_status: $compile_status"
            echo "- smoke_status: $smoke_status"
            echo "- provenance_status: $provenance_status"
            echo '- primary seeds: 63000..63999; audit seeds 63000..63004'
            echo '- fresh M1-M4 ranges: 5951000..5954999'
            echo '- architecture: unchanged 30-contrast W+>=345 confirmatory replication'
            echo '- generation-time audit provenance: experiment059_cell'
            echo
            echo '```text'
            test -f /tmp/compile.log && cat /tmp/compile.log || true
            test -f /tmp/smoke.log && cat /tmp/smoke.log || true
            echo '```'
          } > /tmp/evaluator-preflight.md
          gh issue create --title "Experiment 059 evaluator preflight $compile_status/$smoke_status/$provenance_status $GITHUB_RUN_ID" --body-file /tmp/evaluator-preflight.md
      - name: Enforce evaluator preflight success
        if: always()
        run: |
          test '${{ steps.compile.outcome }}' = 'success'
          test '${{ steps.smoke.outcome }}' = 'success'
          test '${{ steps.provenance.outcome }}' = 'success'
