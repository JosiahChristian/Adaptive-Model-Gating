name: Experiment 054 Evaluator Preflight
on:
  push:
    paths:
      - scripts/run_experiment_054.py
      - scripts/run_experiment_054_shard.py
      - scripts/merge_experiment_054_shards.py
      - scripts/smoke_experiment_054_evaluator.py
      - .github/workflows/experiment-054-evaluator-preflight.yml
permissions: {contents: read, issues: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile Experiment 054 evaluator path
        run: python -m py_compile src/experiment_054.py scripts/run_experiment_054.py scripts/run_experiment_054_shard.py scripts/merge_experiment_054_shards.py scripts/smoke_experiment_054_evaluator.py
      - name: Frozen evaluator smoke
        run: python scripts/smoke_experiment_054_evaluator.py
      - name: Register evaluator preflight
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh issue create --title "Experiment 054 evaluator preflight ${{ job.status }} $GITHUB_RUN_ID" --body "Prospective Experiment 054 evaluator-path preflight. Run: $GITHUB_RUN_ID. Head: $GITHUB_SHA. Status: ${{ job.status }}. No Experiment 054 evaluation outcomes inspected."
