name: Experiment 064 Prospective Preflight
on:
  push:
    paths: [evaluation_requests/experiment_064_preflight.request]
permissions: {contents: read, issues: write}
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile repository Python
        id: compile
        continue-on-error: true
        run: python -m compileall -q src scripts > /tmp/compile.log 2>&1
      - name: Experiment 064 nonreserved smoke
        id: smoke
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        run: python scripts/smoke_experiment_064.py > /tmp/smoke.log 2>&1
      - name: Static frozen contract and provenance check
        id: contract
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'src')
          import experiment_064 as e
          r=Path('src/experiment_064.py').read_text().replace(' ','')
          smoke=Path('scripts/smoke_experiment_064.py').read_text()
          assert e.OPERATIVE_SPEC_ISSUE==250
          assert e.PROVENANCE_CLOSURE_ISSUE==251
          assert e.IMPLEMENTATION_CLOSURE_ISSUE==252
          assert e.ARCHITECTURES==('A0','A1','A2','A3')
          assert e.SEED_RANGES=={'Q1':(6400000,6403000),'Q2':(6403000,6406000),'Q3':(6406000,6409000),'Q4':(6409000,6412000),'Q5':(6412000,6415000),'Q6':(6415000,6418000)}
          assert e.Q1_ROUND_SCALES==(0.40,0.70,1.00,1.60,2.20)
          assert e.Q2_FORWARD_SD==1.0 and e.Q2_REVERSE_SD==2.5
          assert e.Q3_RHO==0.65
          assert e.Q4_CONTAMINATION==0.15 and e.Q4_CONTAMINATION_SD==3.0
          assert e.Q5_CONTAMINATION==0.10 and e.Q5_SHIFT==1.00
          assert e.Q6_DF==2.2 and e.Q6_UNIT_IQR_DENOM==1.6039801884225622
          assert e.W_CUTOFF==345 and e.provenance_integrity()
          assert 'exp49.SIGN_COUNT' in Path('src/experiment_064.py').read_text()
          assert 'exp49.POSITIVE_CUTOFF' in Path('src/experiment_064.py').read_text()
          assert 'exp48.sign_factor' in Path('src/experiment_064.py').read_text()
          assert 'bet_factor' in Path('src/experiment_064.py').read_text()
          assert 'confirmation_profile_061' in Path('src/experiment_064.py').read_text()
          assert 'signed_rank_statistic_30' in Path('src/experiment_064.py').read_text()
          assert '6420000+i' in smoke and '6400000..6417999' in smoke
          req=Path('evaluation_requests/experiment_064_preflight.request').read_text()
          for token in ('issue #250','issue #251','issue #252','no reserved Q1-Q6 outcomes'):
              assert token in req,token
          PY
      - name: Register preflight outcome
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          compile_status='${{ steps.compile.outcome }}'
          smoke_status='${{ steps.smoke.outcome }}'
          contract_status='${{ steps.contract.outcome }}'
          {
            echo 'Experiment 064 prospective preflight completed before any reserved Q1-Q6 evaluation request.'
            echo
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- head_sha: $GITHUB_SHA"
            echo '- operative_spec_issue: #250'
            echo '- provenance_closure_issue: #251'
            echo '- implementation_closure_issue: #252'
            echo "- compile_status: $compile_status"
            echo "- smoke_status: $smoke_status"
            echo "- contract_status: $contract_status"
            echo '- reserved Q1-Q6 seeds: 6400000..6417999 (not executed by preflight)'
            echo '- smoke seeds: 6420000..6420005 (nonreserved)'
            echo
            echo '```text'
            test -f /tmp/compile.log && cat /tmp/compile.log || true
            test -f /tmp/smoke.log && cat /tmp/smoke.log || true
            echo '```'
          } > /tmp/preflight.md
          gh issue create --title "Experiment 064 preflight $compile_status/$smoke_status/$contract_status $GITHUB_RUN_ID" --body-file /tmp/preflight.md
      - name: Enforce preflight success
        if: always()
        run: |
          test '${{ steps.compile.outcome }}' = 'success'
          test '${{ steps.smoke.outcome }}' = 'success'
          test '${{ steps.contract.outcome }}' = 'success'
