name: Experiment 002 Requested Evaluation

on:
  push:
    paths:
      - 'evaluation_requests/experiment_002.request'

permissions:
  contents: read
  issues: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register requested run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Experiment 002 requested run ${{ github.run_id }}" \
            --body "run_id: ${{ github.run_id }}\nhead_sha: ${{ github.sha }}\nstatus: started\ntrigger: evaluation_requests/experiment_002.request"

  test:
    needs: register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v

  evaluate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen Experiment 002
        run: python scripts/run_experiment_002.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: experiment-002-evidence
          path: results/experiment_002/
          if-no-files-found: error
      - name: Register completed evidence run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Automated completed evidence pointer for Experiment 002.'
            echo
            echo "- run_id: ${{ github.run_id }}"
            echo "- run_attempt: ${{ github.run_attempt }}"
            echo "- head_sha: ${{ github.sha }}"
            echo '- trigger: versioned evaluation request marker'
            echo '- artifact_name: experiment-002-evidence'
            echo '- workflow: Experiment 002 Requested Evaluation'
            echo '- status: completed'
            echo
            echo '```json'
            cat results/experiment_002/report.json
            echo '```'
          } > /tmp/evidence_issue.md
          gh issue create --repo "${{ github.repository }}" --title "Experiment 002 evidence run ${{ github.run_id }}" --body-file /tmp/evidence_issue.md
