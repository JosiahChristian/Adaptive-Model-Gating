name: Experiment 001

permissions:
  contents: read
  issues: write
  actions: read

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'research/**'
      - '.github/workflows/experiment-001.yml'
  workflow_dispatch:
    inputs:
      run_evaluation:
        description: 'Run frozen 200-seed evaluation and upload evidence artifact'
        required: true
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v

  evaluate:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evaluation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen Experiment 001
        run: python scripts/run_experiment_001.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: experiment-001-evidence
          path: results/experiment_001/
          if-no-files-found: error
      - name: Register evidence run for automated audit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "Automated evidence pointer for Experiment 001."
            echo
            echo "- run_id: ${RUN_ID}"
            echo "- run_attempt: ${RUN_ATTEMPT}"
            echo "- head_sha: ${HEAD_SHA}"
            echo "- artifact_name: experiment-001-evidence"
            echo "- workflow: Experiment 001"
            echo
            echo '```json'
            cat results/experiment_001/report.json
            echo '```'
          } > /tmp/evidence_issue.md
          gh issue create \
            --repo "${REPOSITORY}" \
            --title "Experiment 001 evidence run ${RUN_ID}" \
            --body-file /tmp/evidence_issue.md
