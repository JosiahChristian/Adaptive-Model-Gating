name: Experiment 057 Requested Diagnostic Evaluation
on:
  push:
    paths: [evaluation_requests/experiment_057.request]
permissions: {contents: read, issues: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile repository Python
        id: compile
        continue-on-error: true
        run: python -m compileall -q src scripts > /tmp/compile.log 2>&1
      - name: Experiment 057 evaluator smoke
        id: smoke
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        run: python scripts/smoke_experiment_057_evaluator.py > /tmp/smoke.log 2>&1
      - name: Static frozen diagnostic contract
        id: contract
        if: steps.compile.outcome == 'success' && steps.smoke.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/run_experiment_057.py').read_text()
          q=Path('scripts/run_experiment_057_shard.py').read_text()
          m=Path('scripts/merge_experiment_057_shards.py').read_text()
          for x in ('range(57000,58000)','5751000','5752000','5753000','5754000','OPERATIVE_SPEC_ISSUE=202','diagnostic_readout','round_block_randomization','reference_wplus_match'):
              assert x in p, x
          assert "'experiment057_cell':c['label']" in q
          assert 'report_from(rows)' in m and 'audit integrity' in m
          print('Experiment 057 frozen diagnostic contract passed')
          PY
      - name: Register requested validation outcome
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          compile_status='${{ steps.compile.outcome }}'
          smoke_status='${{ steps.smoke.outcome }}'
          contract_status='${{ steps.contract.outcome }}'
          {
            echo "Experiment 057 requested diagnostic validation completed."
            echo
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- head_sha: $GITHUB_SHA"
            echo "- compile_status: $compile_status"
            echo "- smoke_status: $smoke_status"
            echo "- contract_status: $contract_status"
            echo "- operative_spec_issue: 202"
            echo "- frozen_primary_seeds: 57000..57999"
            echo "- diagnostic_only: true"
            echo
            echo '```text'
            test -f /tmp/compile.log && cat /tmp/compile.log || true
            test -f /tmp/smoke.log && cat /tmp/smoke.log || true
            echo '```'
          } > /tmp/validation.md
          gh issue create --title "Experiment 057 requested diagnostic validation $compile_status/$smoke_status/$contract_status $GITHUB_RUN_ID" --body-file /tmp/validation.md
      - name: Enforce requested validation success
        if: always()
        run: |
          test '${{ steps.compile.outcome }}' = 'success'
          test '${{ steps.smoke.outcome }}' = 'success'
          test '${{ steps.contract.outcome }}' = 'success'
  prepare:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          sys.path.insert(0,'scripts')
          from run_experiment_057 import CELLS
          print('cells='+json.dumps([{'index':i,'dir':f'cell-{i:02d}','label':c['label']} for i,c in enumerate(CELLS)],separators=(',',':')))
          PY
  evaluate-shards:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/run_experiment_057_shard.py --cell-index ${{ matrix.index }} --out results/experiment_057_shards/${{ matrix.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: results/experiment_057_shards/${{ matrix.dir }}/
          if-no-files-found: error
          compression-level: 9
          retention-days: 2
  evaluate:
    needs: evaluate-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {path: results/experiment_057_shards}
      - name: Deterministically merge and validate diagnostic evidence
        run: python scripts/merge_experiment_057_shards.py --input-root results/experiment_057_shards --out results/experiment_057
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-057-evidence
          path: results/experiment_057/
          if-no-files-found: error
          compression-level: 9
      - name: Register completed diagnostic evidence pointer
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('results/experiment_057/report.json').read_text())
          compact={k:r.get(k) for k in ('experiment','operative_spec_issue','evaluation_seeds','audit_seeds','diagnostic_only','w_cutoff_reference_only','split_contract','D1_integrity','stress_panel','no_tuning','diagnostic_row_count','audit_row_count')}
          body=('Automated completed diagnostic evidence pointer for Experiment 057.\n\n'
                f"- run_id: {os.environ['GITHUB_RUN_ID']}\n- head_sha: {os.environ['GITHUB_SHA']}\n"
                '- artifact_name: experiment-057-evidence\n- status: completed\n'
                '- execution: diagnostic-only frozen dependence/selection analysis across 16 cells, 1,000 fresh seeds/cell, plus fresh M1-M4 synthetic stresses\n'
                '- audit provenance: experiment057_cell stamped at shard generation and structurally validated during merge\n'
                '- deployment: unchanged; W+>=345 is reference-only in this diagnostic and no replacement rule is fitted\n'
                '- full_report: results/experiment_057/report.json inside artifact `experiment-057-evidence`\n\n'
                '```json\n'+json.dumps(compact,indent=2)+'\n```\n')
          Path('/tmp/experiment057_issue.md').write_text(body)
          PY
          gh issue create --title "Experiment 057 diagnostic evidence run $GITHUB_RUN_ID" --body-file /tmp/experiment057_issue.md
