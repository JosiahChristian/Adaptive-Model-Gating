name: Experiment 068 CQ Evidence Merge
on:
  push:
    paths:
      - 'evaluation_requests/experiment_068_calibration_merge.request.json'
permissions:
  actions: read
  contents: read
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned statistical dependency
        run: pip install scipy==1.17.0
      - name: Pin frozen merge implementation and request
        run: |
          test "$(git hash-object scripts/merge_experiment_068_calibration.py)" = "a9f8fe898886b3a4e7d41f75de0080016235c0fc"
          python - <<'PY'
          import json
          q=json.load(open('evaluation_requests/experiment_068_calibration_merge.request.json'))
          expected={'experiment':68,'operative_spec_issue':287,'provenance_closure_issue':288,'execution_closure_issue':289,'evidence_closure_issue':290,'source_run_id':34064843727,'expected_artifacts':96,'expected_source_rows':48000,'merge_blob':'a9f8fe898886b3a4e7d41f75de0080016235c0fc','scipy_version':'1.17.0','interpret_only_after_preservation':True,'xq_touched':False,'experiment_067_rq_touched':False,'experiment_066_validation_touched':False,'no_tuning':True}
          assert q==expected,(q,expected)
          PY
      - name: Inventory and download exact frozen CQ artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          python - <<'PY'
          import json,os,re,subprocess,zipfile
          from pathlib import Path
          import urllib.request
          run=34064843727
          req=urllib.request.Request(f'https://api.github.com/repos/${{ github.repository }}/actions/runs/{run}/artifacts?per_page=100',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(req))
          arts=[a for a in data['artifacts'] if not a['expired']]
          pat=re.compile(r'^experiment-068-calibration-(CQ[1-6])-shard-(\d+)$')
          selected={}
          for a in arts:
            m=pat.match(a['name'])
            if not m: continue
            key=(m.group(1),int(m.group(2)))
            if key in selected: raise SystemExit(f'duplicate artifact {key}')
            selected[key]=a
          expected={(f'CQ{i}',k) for i in range(1,7) for k in range(16)}
          if set(selected)!=expected: raise SystemExit(f'artifact coordinate mismatch missing={sorted(expected-set(selected))} extra={sorted(set(selected)-expected)}')
          manifest=[]
          for key,a in sorted(selected.items()):
            z=Path('inputs')/(a['name']+'.zip')
            subprocess.run(['curl','-fsSL','-H','Authorization: Bearer '+os.environ['GH_TOKEN'],'-H','Accept: application/vnd.github+json',a['archive_download_url'],'-o',str(z)],check=True)
            d=Path('inputs')/a['name']; d.mkdir()
            with zipfile.ZipFile(z) as f: f.extractall(d)
            z.unlink()
            manifest.append({'name':a['name'],'id':a['id'],'digest':a.get('digest'),'workflow_run_id':run})
          Path('download_manifest.json').write_text(json.dumps(manifest,indent=2))
          print('Exact 96-artifact Experiment 068 CQ inventory downloaded; scientific rows not printed')
          PY
      - name: Reconstruct integrity and frozen calibration report
        run: python scripts/merge_experiment_068_calibration.py --input inputs --out merged
      - name: Preserve merged evidence before interpretation
        uses: actions/upload-artifact@v4
        with:
          name: experiment-068-cq-merged-preserved-evidence
          path: |
            merged/
            download_manifest.json
            evaluation_requests/experiment_068_calibration_merge.request.json
          retention-days: 30
