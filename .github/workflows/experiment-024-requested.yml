name: Experiment 024 Requested Evaluation
on:
  push:
    paths: [evaluation_requests/experiment_024.request]
permissions: {contents: read, issues: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m compileall -q src scripts
      - run: python scripts/smoke_experiment_024.py
  prepare:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          sys.path.insert(0,'scripts')
          from run_experiment_024 import CELLS
          print('cells='+json.dumps([{'label':c['label']} for c in CELLS],separators=(',',':')))
          PY
  evaluate-shards:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 28
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.cells) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run frozen Experiment 024 cell
        env:
          EXPERIMENT_024_LABEL: ${{ matrix.label }}
        run: python scripts/run_experiment_024_shard.py
      - uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.label }}'
          path: 'results/experiment_024_shards/${{ matrix.label }}/'
          if-no-files-found: error
          compression-level: 9
          retention-days: 1
  evaluate:
    needs: evaluate-shards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {path: results/experiment_024_shards}
      - run: python scripts/merge_experiment_024_shards.py
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-024-evidence
          path: results/experiment_024/
          if-no-files-found: error
          compression-level: 9
      - name: Register completed evidence pointer
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('results/experiment_024/report.json').read_text())
          compact={k:r.get(k) for k in ('evaluation_seeds','n_seeds_per_cell','cell_count','strategies','no_recalibration','audit_seeds','hypotheses')}
          body=('Automated completed evidence pointer for Experiment 024.\n\n'
                f"- run_id: {os.environ['GITHUB_RUN_ID']}\n- head_sha: {os.environ['GITHUB_SHA']}\n"
                '- artifact_name: experiment-024-evidence\n- status: completed\n'
                '- execution: sharded across forty-six frozen margin/noise cells\n'
                '- full_report: results/experiment_024/report.json inside artifact `experiment-024-evidence`\n\n'
                '```json\n'+json.dumps(compact,indent=2)+'\n```\n')
          Path('/tmp/experiment024_issue.md').write_text(body)
          PY
          gh issue create --title "Experiment 024 evidence run $GITHUB_RUN_ID" --body-file /tmp/experiment024_issue.md
